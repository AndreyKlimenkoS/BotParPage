<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банный Клуб</title>
    <!-- Подключаем Telegram Web Apps API -->
    <script src="https://telegram.org">
		// 1. Инициализируем Telegram Web App
		const tg = window.Telegram.WebApp;
		tg.ready(); // Сообщаем Telegram, что приложение готово
		tg.expand(); // Разворачиваем приложение на весь экран
		
		// 2. Функция обработки нажатия на кнопку "Записаться"
		function joinEvent(buttonElement) {
		    // Находим карточку события, в которой была нажата кнопка
		    const eventItem = buttonElement.closest('.event-item');
		    
		    // Вытаскиваем название бани и дату/время из заголовков
		    const banyaName = eventItem.querySelector('.event-header span:first-child').innerText;
		    const eventTime = eventItem.querySelector('.event-header span:last-child').innerText;
		
		    // Формируем JSON-пакет для вашего Python-бота
		    const dataToSend = {
		        action: "join_banya",
		        banya: banyaName,
		        time: eventTime
		    };
		
		    // Меняем текст кнопки для визуального отклика
		    buttonElement.innerText = "Отправка...";
		    buttonElement.style.backgroundColor = "#e0e0e0";
		    buttonElement.disabled = true;
		
		    // 3. Отправляем данные в Бот (Окно Mini App автоматически закроется)
		    tg.sendData(JSON.stringify(dataToSend));
		}
	</script>
    <style>
        :root {

            15% {

            }
            50% {

            }
            100% {

            50% { transform: translateY(-50vh) scale(3) translateX(50px); opacity: 0.3; }
            100% { transform: translateY(-110vh) scale(5) translateX(-50px); opacity: 0; }
        }

        /* Навигация (Таб-бар внизу) */

        /* Экраны */

        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {

        }

        .card {
            background: var(--glass-bg);

            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
            backdrop-filter: blur(5px);
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 8px;

        .btn {
            background: linear-gradient(135deg, var(--accent-gold), #b89324);
            color: var(--wood-dark);
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Стили формы */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;

        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--wood-light);
            border-radius: 10px;

            font-size: 15px;

        }

        .form-group input:focus, .form-group select:focus {

        /* Список событий */
        .event-item {
            border-left: 4px solid var(--accent-gold);

        .event-header {

        }

        /* Рейтинг */
        .leaderboard-item {
            display: flex;

        }

        .rank {
            font-weight: bold;
            color: var(--accent-gold);
            width: 24px;
        }

        .score {
            font-weight: bold;
        }
    </style>
</head>
