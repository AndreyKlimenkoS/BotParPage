<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Групповой бот</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --sec: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --text: var(--tg-theme-text-color, #000);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --link: var(--tg-theme-link-color, #2e7cd1);
    --btn: var(--tg-theme-button-color, #2e7cd1);
    --btn-text: var(--tg-theme-button-text-color, #fff);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px 12px 96px;
    font: 15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  h1 { font-size: 18px; margin: 4px 0 14px; }
  .card {
    background: var(--sec); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px;
  }
  .season-head {
    display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    font-weight: 600;
  }
  .badge {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    background: var(--btn); color: var(--btn-text); text-transform: uppercase; letter-spacing: .3px;
  }
  .badge.closed { background: var(--hint); }
  .muted { color: var(--hint); font-size: 13px; }
  .chev { margin-left: auto; color: var(--hint); transition: transform .15s; }
  details[open] .chev { transform: rotate(90deg); }
  details > summary { list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  td { padding: 6px 4px; vertical-align: middle; }
  tr + tr td { border-top: 1px solid rgba(128,128,128,.18); }
  .rk { width: 34px; text-align: center; font-weight: 700; }
  .rk .m { font-size: 18px; }
  .nm { word-break: break-word; }
  .sub { color: var(--hint); font-size: 12px; }
  .sc { width: 44px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sc.neg { color: #d9534f; }
  .empty { color: var(--hint); padding: 10px 2px; }
  .err { color: #d9534f; padding: 16px 2px; }

  /* --- вкладки --- */
  #tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  #tabs button {
    flex: 1; padding: 9px 4px; border: 0; border-radius: 10px; font: inherit; font-size: 13px;
    font-weight: 600; background: var(--sec); color: var(--text); opacity: .6; white-space: nowrap;
  }
  #tabs button.active { background: var(--btn); color: var(--btn-text); opacity: 1; }

  /* --- экран события --- */
  .ev-title { font-weight: 600; margin-bottom: 4px; }
  .ev-meta { color: var(--hint); font-size: 13px; margin-bottom: 10px; }
  .ev-list h4 { margin: 10px 0 4px; font-size: 13px; color: var(--hint); font-weight: 600; }
  .ev-list div { padding: 2px 0; word-break: break-word; }
  .ev-list b { color: var(--link); font-weight: 600; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row button {
    flex: 1; padding: 12px; border: 0; border-radius: 12px; font: inherit; font-weight: 600;
    background: var(--btn); color: var(--btn-text);
  }
  .row button.secondary { background: transparent; color: var(--text); border: 1px solid var(--hint); }
  .row button.danger { background: transparent; color: #d9534f; border: 1px solid #d9534f; }
  .row button:disabled, form[data-disabled] button:disabled { opacity: .45; }

  form label { display: block; font-size: 13px; color: var(--hint); margin: 10px 0 4px; }
  form input, form textarea {
    width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(128,128,128,.35);
    background: var(--bg); color: var(--text); font: inherit;
  }
  form input:disabled, form textarea:disabled { opacity: .5; }
  .note { color: var(--hint); font-size: 13px; margin-top: 10px; }

  #closebar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid rgba(128,128,128,.18);
  }
  #closebar button {
    width: 100%; padding: 13px; border: 0; border-radius: 12px;
    font: inherit; font-weight: 600; background: var(--btn); color: var(--btn-text);
  }
</style>
</head>
<body>
<div id="tabs">
  <button data-tab="event" class="tab active">🌿 Событие</button>
  <button data-tab="rating" class="tab">🏆 Рейтинг</button>
  <button data-tab="settings" class="tab">⚙️ Настройки</button>
  <button data-tab="donate" class="tab">❤️ Донат</button>
</div>
<div id="app"><div class="muted">Загрузка…</div></div>
<div id="closebar"><button id="close">Закрыть</button></div>

<script>
const API_BASE = "https://parmeyster.duckdns.org:9443";   // <<< адрес API (DuckDNS + Caddy, порт 9443)

const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
document.getElementById("close").onclick = () => tg.close();

const app = document.getElementById("app");
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const crown = r => r === 1 ? "👑" : r === 2 ? "🥈" : r === 3 ? "🥉" : "";
const fmtDate = iso => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  return m ? `${m[3]}.${m[2]}.${m[1]}` : (iso || "");
};

const CHAT_ID = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
let busy = false; // блокировка повторных тапов, пока идёт запрос

// До этой строки — иначе TDZ: renderIntro() (личка) зовёт donateCardHtml() ещё до
// исполнения `if`-гейта ниже, а он раньше объявлялся ближе к концу файла (ReferenceError,
// "Загрузка…" так и оставалась — в группе не ловилось: там donateCardHtml() вызывается
// позже, по клику на вкладку, когда скрипт уже весь отработал).
const DONATE_AMOUNTS = [50, 100, 300, 500];

function confirmDialog(text) {
  return new Promise(resolve => {
    if (tg.showConfirm) tg.showConfirm(text, resolve);
    else resolve(window.confirm(text));
  });
}

function apiGet(path) {
  return fetch(API_BASE + path, { headers: { "X-Telegram-Init-Data": tg.initData } })
    .then(async r => {
      if (!r.ok) {
        const data = await r.json().catch(() => ({}));
        throw new Error(data.hint || data.error || r.status);
      }
      return r.json();
    });
}
function apiSend(method, path, body) {
  return fetch(API_BASE + path, {
    method,
    headers: { "X-Telegram-Init-Data": tg.initData, "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  }).then(async r => {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.message || data.error || r.status);
    return data;
  });
}
function apiPost(path, body) { return apiSend("POST", path, body); }
function apiPut(path, body) { return apiSend("PUT", path, body); }

if (!tg.initData) {
  app.innerHTML = '<div class="err">Открой приложение из Telegram.</div>';
  document.getElementById("tabs").hidden = true;
} else if (!CHAT_ID) {
  // Личный чат с ботом — нет group chat_id, показать чьи-то данные нечем (Mini App per-chat).
  // Вместо ошибки — ознакомительный экран: что умеет бот, без обращений к API.
  renderIntro();
  document.getElementById("tabs").hidden = true;
} else {
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
  showTab("event");
}

function renderIntro() {
  app.innerHTML = `
    <div class="card">
      <div class="ev-title">🌿 Данный бот — для групповых чатов</div>
      <div class="ev-meta">Вот что вы увидите здесь, если открыть приложение кнопкой /app из своей группы.</div>
    </div>
    <div class="card">
      <div class="ev-title">Как начать</div>
      <div class="ev-meta">Добавьте меня в свою группу и дайте права администратора (закреплять сообщения,
        менять титулы участников). Дальше команда <b>/app</b> в группе откроет приложение с данными вашего чата.</div>
    </div>
    <div class="card">
      <div class="ev-title">🌿 Событие</div>
      <div class="ev-meta">Создать сбор, лимит участников, очередь ожидания, отметиться «Иду» / «Не иду».</div>
    </div>
    <div class="card">
      <div class="ev-title">🏆 Рейтинг</div>
      <div class="ev-meta">Баллы по итогам событий, сезоны, плашки-титулы для админов чата.</div>
    </div>
    <div class="card">
      <div class="ev-title">⏰ Напоминания</div>
      <div class="ev-meta">Напоминания и анонсы по расписанию — прямо в чат.</div>
    </div>
    <div class="card">
      <div class="ev-title">⚙️ Настройки</div>
      <div class="ev-meta">Текст объявления, веса рейтинга, названия титулов, уведомления, права участников.</div>
    </div>` + donateCardHtml();
  wireDonateButtons();
}

function showTab(tab) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  if (tab === "event") loadEvent();
  else if (tab === "rating") loadRating();
  else if (tab === "donate") loadDonate();
  else loadSettings();
}

// ------------------------------------------------------------------ Событие

function loadEvent() {
  app.innerHTML = '<div class="muted">Загрузка…</div>';
  apiGet(`/api/chats/${CHAT_ID}/event`)
    .then(renderEvent)
    .catch(e => { app.innerHTML = '<div class="err">Не удалось загрузить событие.<br><span class="sub">' + esc(String(e)) + '</span></div>'; });
}

function namesBlock(title, items, waitAfter) {
  const rows = items.length
    ? items.map((n, i) => `<div>${i + 1}. ${waitAfter != null && i >= waitAfter ? "<b>Ожидание</b> " : ""}${esc(n)}</div>`).join("")
    : '<div class="muted">—</div>';
  return `<div class="ev-list"><h4>${title}</h4>${rows}</div>`;
}

function distanceCardHtml() {
  return `
    <div class="card">
      <div class="ev-title">📍 Расстояние до бани</div>
      <div class="ev-meta">Поделись геолокацией браузера — посчитаю и отправлю в чат.</div>
      <div class="row"><button data-action="distance">Определить расстояние</button></div>
    </div>`;
}

function wireDistanceButton() {
  const distBtn = app.querySelector('[data-action="distance"]');
  if (distBtn) distBtn.onclick = onDistance;
}

function donateCardHtml() {
  return `
    <div class="card">
      <div class="ev-title">❤️ Поддержать бота</div>
      <div class="ev-meta">Telegram Stars — оплата прямо здесь, без внешних ссылок и карт.</div>
      <div class="row">${DONATE_AMOUNTS.slice(0, 2).map(a => `<button data-donate="${a}">${a} ⭐</button>`).join("")}</div>
      <div class="row">${DONATE_AMOUNTS.slice(2).map(a => `<button data-donate="${a}">${a} ⭐</button>`).join("")}</div>
    </div>`;
}

function wireDonateButtons() {
  app.querySelectorAll('[data-donate]').forEach(b => b.onclick = () => onDonate(Number(b.dataset.donate)));
}

function onDonate(amount) {
  if (busy) return;
  if (!tg.openInvoice) { (tg.showAlert || alert)("Обнови приложение Telegram — эта версия не поддерживает оплату Stars."); return; }
  busy = true;
  app.querySelectorAll("button").forEach(b => b.disabled = true);
  apiPost("/api/donate/invoice-link", { amount })
    .then(r => {
      tg.openInvoice(r.link, status => {
        if (status === "paid") (tg.showAlert || alert)("Спасибо! Звёзды получены 🌟");
        else if (status === "failed") (tg.showAlert || alert)("Оплата не прошла.");
        busy = false;
        app.querySelectorAll("button").forEach(b => b.disabled = false);
      });
    })
    .catch(e => {
      busy = false;
      app.querySelectorAll("button").forEach(b => b.disabled = false);
      (tg.showAlert || alert)(String(e));
    });
}

function renderEvent(data) {
  const isAdmin = !!data.is_admin;
  const ev = data.event;

  if (!ev) {
    app.innerHTML = `
      <div class="card">
        <div class="ev-title">Открытых событий нет</div>
        <div class="ev-meta">${isAdmin ? "Заполни форму и объяви сбор в чате" : "Здесь появится новое событие, как только админ его создаст"}</div>
        <form id="create-form"${isAdmin ? "" : " data-disabled"}>
          <label>Дата</label>
          <input type="date" id="f-date" required ${isAdmin ? "" : "disabled"}>
          <label>Описание</label>
          <textarea id="f-title" rows="3" placeholder="Собираемся в Коптевских банях..." ${isAdmin ? "" : "disabled"}></textarea>
          <label>Лимит участников (необязательно)</label>
          <input type="number" id="f-limit" min="0" placeholder="без лимита" ${isAdmin ? "" : "disabled"}>
          <div class="row"><button type="button" data-action="create" ${isAdmin ? "" : "disabled"}>Создать и объявить в чате</button></div>
        </form>
        ${isAdmin ? "" : '<div class="note">Создавать события может только администратор чата.</div>'}
      </div>` + distanceCardHtml();
    app.querySelector('[data-action="create"]').onclick = onCreate;
    wireDistanceButton();
    return;
  }

  const limit = ev.limit_n; // null = без лимита
  app.innerHTML = `
    <div class="card">
      <div class="ev-title">${esc((ev.title || "").split("\n")[0] || "Баня")}</div>
      <div class="ev-meta">${ev.event_date ? fmtDate(ev.event_date) + " · " : ""}${ev.limit_n != null ? "лимит: " + ev.limit_n : "без лимита"}</div>
      ${namesBlock("Идут", ev.yes, limit == null ? null : limit)}
      ${namesBlock("Не идут", ev.no)}
      ${namesBlock("Слились", ev.leave)}
      <div class="row">
        <button data-action="vote" data-choice="yes">✅ Иду</button>
        <button data-action="vote" data-choice="no">❌ Не иду</button>
      </div>
      ${isAdmin ? `
      <div class="row">
        <button class="secondary" data-action="close" data-status="done">⏹ Стоп (сохранить)</button>
        <button class="danger" data-action="close" data-status="canceled">✕ Отменить</button>
      </div>
      <form>
        <label style="margin-top:14px">Участник без аккаунта (по имени)</label>
        <input type="text" id="ev-manual-name" placeholder="Имя Фамилия">
      </form>
      <div class="row">
        <button data-action="manual-add">Добавить</button>
        <button data-action="manual-del">Убрать</button>
      </div>` : ""}
    </div>` + distanceCardHtml();

  app.querySelectorAll('[data-action="vote"]').forEach(b => b.onclick = () => onVote(ev.id, b.dataset.choice));
  app.querySelectorAll('[data-action="close"]').forEach(b => b.onclick = () => onClose(ev.id, b.dataset.status));
  const manualAddBtn = app.querySelector('[data-action="manual-add"]');
  if (manualAddBtn) manualAddBtn.onclick = () => onManualParticipant(ev.id, "POST");
  const manualDelBtn = app.querySelector('[data-action="manual-del"]');
  if (manualDelBtn) manualDelBtn.onclick = () => onManualParticipant(ev.id, "DELETE");
  wireDistanceButton();
}

function withBusy(fn, reload) {
  if (busy) return;
  busy = true;
  app.querySelectorAll("button").forEach(b => b.disabled = true);
  const onDone = reload || loadEvent;
  Promise.resolve(fn()).catch(e => tg.showAlert ? tg.showAlert(String(e)) : alert(e))
    .finally(() => { busy = false; onDone(); });
}

function onVote(eventId, choice) {
  withBusy(() => apiPost(`/api/events/${eventId}/vote`, { choice }));
}

function onClose(eventId, status) {
  const text = status === "done" ? "Остановить событие и зафиксировать рейтинг?" : "Отменить событие без сохранения результатов?";
  confirmDialog(text).then(ok => { if (ok) withBusy(() => apiPost(`/api/events/${eventId}/close`, { status })); });
}

function onManualParticipant(eventId, method) {
  const input = document.getElementById("ev-manual-name");
  const name = input.value.trim();
  if (!name) { (tg.showAlert || alert)("Введи имя участника"); return; }
  withBusy(() => apiSend(method, `/api/events/${eventId}/participants`, { name }));
}

function onCreate() {
  const title = document.getElementById("f-title").value.trim();
  const event_date = document.getElementById("f-date").value;
  const limitRaw = document.getElementById("f-limit").value;
  const limit_n = limitRaw === "" ? null : Number(limitRaw);
  if (!event_date) { (tg.showAlert || alert)("Укажи дату похода"); return; }
  if (!title) { (tg.showAlert || alert)("Опиши, куда и когда собираемся"); return; }
  withBusy(() => apiPost(`/api/chats/${CHAT_ID}/events`, { title, event_date, limit_n }));
}

function onDistance() {
  if (!navigator.geolocation) { (tg.showAlert || alert)("Браузер не поддерживает геолокацию."); return; }
  if (busy) return;
  busy = true;
  app.querySelectorAll("button").forEach(b => b.disabled = true);
  navigator.geolocation.getCurrentPosition(
    pos => {
      apiPost(`/api/chats/${CHAT_ID}/distance`, { lat: pos.coords.latitude, lon: pos.coords.longitude })
        .then(r => { (tg.showAlert || alert)(r.text); })
        .catch(e => (tg.showAlert || alert)(String(e)))
        .finally(() => { busy = false; loadEvent(); });
    },
    err => {
      busy = false;
      app.querySelectorAll("button").forEach(b => b.disabled = false);
      (tg.showAlert || alert)("Не удалось получить геолокацию: " + err.message);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// ------------------------------------------------------------------ Настройки

function loadSettings() {
  app.innerHTML = '<div class="muted">Загрузка…</div>';
  Promise.all([
    apiGet(`/api/chats/${CHAT_ID}/members`),
    apiGet(`/api/chats/${CHAT_ID}/settings`),
  ]).then(([membersData, settingsData]) => renderSettings(membersData, settingsData))
    .catch(e => {
      app.innerHTML = '<div class="err">Не удалось загрузить настройки.<br><span class="sub">' + esc(String(e)) + '</span></div>';
    });
}

function renderSettings(membersData, settingsData) {
  const isAdmin = !!settingsData.is_admin;
  const dis = isAdmin ? "" : "disabled";
  const members = membersData.members || [];
  const pending = members.filter(m => !m.is_admin);
  const rating = settingsData.rating || { went: 1, waited: 0, missed: -1, bailed: -2 };
  const header = settingsData.event_header || "";
  const titles = settingsData.titles || { good: "Banshchik", zero: "NULL", bad: "SubZero", special: "KL-Team" };

  const memberRows = members.length
    ? members.map(m => `
        <div class="row" style="margin-top:6px">
          <div style="flex:1;align-self:center">${esc(m.display)}
            ${m.is_admin ? ' <span class="badge">Админ</span>' : ""}
            ${m.is_special ? ' <span class="badge" style="background:#c9a227">★ Особый</span>' : ""}
          </div>
          ${isAdmin ? `
          ${m.is_admin ? "" : `<button style="flex:0 0 auto;padding:8px 12px" data-action="grant-one" data-uid="${m.tg_user_id}">Выдать</button>`}
          <button style="flex:0 0 auto;padding:8px 12px" data-action="toggle-special" data-uid="${m.tg_user_id}" data-special="${m.is_special ? "1" : "0"}">${m.is_special ? "Снять ★" : "★ Особый"}</button>
          ` : ""}
        </div>`).join("")
    : '<div class="muted">Бот пока никого не знает в этом чате — участники появляются здесь после первого голоса или ручного добавления.</div>';

  app.innerHTML = `
    ${isAdmin ? "" : '<div class="card"><div class="note" style="margin-top:0">Изменять настройки может только администратор чата — здесь только просмотр.</div></div>'}

    <details class="card">
      <summary class="season-head">Права участников<span class="chev">▸</span></summary>
      <div class="ev-meta">Чтобы бот мог «видеть» участника чата, у него должны быть права
        администратора в Telegram — без них Bot API его не показывает. Новым участникам бот
        выдаёт эти права сам, автоматически. Если бот добавлен в уже существующий чат, тем, кто
        был в нём раньше, права нужно выдать самостоятельно — в настройках чата Telegram, либо
        здесь кнопкой ниже; сюда также попадают все, кто хотя бы раз проголосовал.</div>
      ${isAdmin ? `<div class="row"><button type="button" data-action="grant-all" ${pending.length ? "" : "disabled"}>Выдать права всем (${pending.length})</button></div>` : ""}
      ${memberRows}
    </details>

    <details class="card">
      <summary class="season-head">Баллы рейтинга<span class="chev">▸</span></summary>
      <div class="ev-meta">Задай правила начисления баллов: за «сходил», «не пошёл», «слился»
        и «ожидал» при завершении события начисляется соответствующее число баллов. Общий
        рейтинг сезона — сумма баллов за все завершённые события сезона.</div>
      <form${isAdmin ? "" : " data-disabled"}>
        <label>Сходил (был)</label>
        <input type="number" id="s-went" value="${rating.went}" ${dis}>
        <label>Ожидание (записался сверх лимита)</label>
        <input type="number" id="s-waited" value="${rating.waited}" ${dis}>
        <label>Не пошёл (проголосовал «не иду»)</label>
        <input type="number" id="s-missed" value="${rating.missed}" ${dis}>
        <label>Слился (записался «иду», потом ушёл в «не иду»)</label>
        <input type="number" id="s-bailed" value="${rating.bailed}" ${dis}>
      </form>
      <div class="row"><button type="button" data-action="save-rating" ${dis}>Сохранить баллы</button></div>
    </details>

    <details class="card">
      <summary class="season-head">Telegram Title<span class="chev">▸</span></summary>
      <div class="ev-meta">Заголовок участника в Telegram — до 16 символов, без эмодзи. У «Особых»
        (★ ниже) — свой Telegram Title вместо расчётного по баллам.</div>
      <form${isAdmin ? "" : " data-disabled"}>
        <label>Рейтинг больше 0</label>
        <input type="text" id="s-title-good" maxlength="16" value="${esc(titles.good)}" ${dis}>
        <label>Рейтинг равен 0</label>
        <input type="text" id="s-title-zero" maxlength="16" value="${esc(titles.zero)}" ${dis}>
        <label>Рейтинг меньше 0</label>
        <input type="text" id="s-title-bad" maxlength="16" value="${esc(titles.bad)}" ${dis}>
        <label>Особый статус (★)</label>
        <input type="text" id="s-title-special" maxlength="16" value="${esc(titles.special)}" ${dis}>
      </form>
      <div class="row"><button type="button" data-action="save-titles" ${dis}>Сохранить названия</button></div>
    </details>

    <details class="card">
      <summary class="season-head">Обновить Telegram Title<span class="chev">▸</span></summary>
      <div class="ev-meta">Массово выставить Telegram Title всем админам чата (кроме владельца —
        Telegram не даёт менять его титул боту). Происходит и само: по рейтингу — при завершении
        события, на начальные — при завершении сезона. Здесь можно запустить это ещё раз вручную;
        работает фоново, отчёт придёт сообщением в чат.</div>
      <div class="row">
        <button data-action="apply-titles-rating" ${dis}>По рейтингу</button>
        <button data-action="apply-titles-reset" ${dis}>Сбросить на начальные</button>
      </div>
    </details>

    <details class="card">
      <summary class="season-head">Шапка объявления<span class="chev">▸</span></summary>
      <div class="ev-meta">Текст перед описанием при создании события. Пусто — вернуть текст по умолчанию.</div>
      <form${isAdmin ? "" : " data-disabled"}>
        <textarea id="s-header" rows="3" placeholder="Уважаемые любители пара, объявляется общий сбор:" ${dis}>${esc(header)}</textarea>
      </form>
      <div class="row"><button type="button" data-action="save-header" ${dis}>Сохранить шапку</button></div>
    </details>

    <details class="card">
      <summary class="season-head">Уведомления<span class="chev">▸</span></summary>
      <div class="ev-meta">Автосообщения от бота в этот чат (автозавершение события в 22:10 — всегда включено).</div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:10px">
        <input type="checkbox" id="s-notify-morning" ${settingsData.notify_morning ? "checked" : ""} ${dis}> Утренняя напоминалка (06:45)
      </label>
      <label style="display:flex;align-items:center;gap:8px;margin-top:8px">
        <input type="checkbox" id="s-notify-steam" ${settingsData.notify_steam ? "checked" : ""} ${dis}> Анонсы паров (17:50–20:50)
      </label>
      <div class="row"><button type="button" data-action="save-notify" ${dis}>Сохранить</button></div>
    </details>`;

  if (isAdmin) {
    app.querySelector('[data-action="save-rating"]').onclick = onSaveRating;
    app.querySelector('[data-action="save-titles"]').onclick = onSaveTitles;
    app.querySelector('[data-action="save-notify"]').onclick = onSaveNotify;
    app.querySelector('[data-action="save-header"]').onclick = onSaveHeader;
    app.querySelector('[data-action="apply-titles-rating"]').onclick = () => onApplyTitles(true);
    app.querySelector('[data-action="apply-titles-reset"]').onclick = () => onApplyTitles(false);
    const grantAllBtn = app.querySelector('[data-action="grant-all"]');
    if (grantAllBtn) grantAllBtn.onclick = () => onGrantAll(pending.length);
    app.querySelectorAll('[data-action="grant-one"]').forEach(b => b.onclick = () => onGrantOne(Number(b.dataset.uid)));
    app.querySelectorAll('[data-action="toggle-special"]').forEach(b => b.onclick = () => onToggleSpecial(Number(b.dataset.uid), b.dataset.special === "1"));
  }
}

function onApplyTitles(byRating) {
  const msg = byRating
    ? "Обновить Telegram Title всех админов по текущему рейтингу?"
    : "Сбросить Telegram Title всех админов на начальные?";
  confirmDialog(msg + " Результат придёт сообщением в чат.")
    .then(ok => { if (ok) withBusy(() => apiPost(`/api/chats/${CHAT_ID}/rating/apply-titles`, { by_rating: byRating }), loadSettings); });
}

function onSaveRating() {
  const went = Number(document.getElementById("s-went").value);
  const waited = Number(document.getElementById("s-waited").value);
  const missed = Number(document.getElementById("s-missed").value);
  const bailed = Number(document.getElementById("s-bailed").value);
  if (![went, waited, missed, bailed].every(Number.isFinite)) { (tg.showAlert || alert)("Баллы должны быть числами"); return; }
  withBusy(() => apiPut(`/api/chats/${CHAT_ID}/settings`, { rating: { went, waited, missed, bailed } }), loadSettings);
}

function onSaveTitles() {
  const titles = {
    good: document.getElementById("s-title-good").value.trim(),
    zero: document.getElementById("s-title-zero").value.trim(),
    bad: document.getElementById("s-title-bad").value.trim(),
    special: document.getElementById("s-title-special").value.trim(),
  };
  if (Object.values(titles).some(v => !v)) { (tg.showAlert || alert)("Все названия обязательны, до 16 символов"); return; }
  withBusy(() => apiPut(`/api/chats/${CHAT_ID}/settings`, { titles }), loadSettings);
}

function onSaveNotify() {
  const notify_morning = document.getElementById("s-notify-morning").checked;
  const notify_steam = document.getElementById("s-notify-steam").checked;
  withBusy(() => apiPut(`/api/chats/${CHAT_ID}/settings`, { notify_morning, notify_steam }), loadSettings);
}

function onSaveHeader() {
  const event_header = document.getElementById("s-header").value;
  withBusy(() => apiPut(`/api/chats/${CHAT_ID}/settings`, { event_header }), loadSettings);
}

function onGrantOne(uid) {
  withBusy(() => apiPost(`/api/chats/${CHAT_ID}/permissions`, { tg_user_id: uid }), loadSettings);
}

function onGrantAll(pendingCount) {
  confirmDialog(`Выдать базовые права всем без админ-статуса (${pendingCount})? Результат придёт сообщением в чат.`)
    .then(ok => { if (ok) withBusy(() => apiPost(`/api/chats/${CHAT_ID}/permissions`, { all: true }), loadSettings); });
}

function onToggleSpecial(uid, isSpecial) {
  withBusy(() => apiSend(isSpecial ? "DELETE" : "POST", `/api/chats/${CHAT_ID}/special-titles`, { tg_user_id: uid }), loadSettings);
}

// ------------------------------------------------------------------ Рейтинг

function loadRating() {
  app.innerHTML = '<div class="muted">Загрузка…</div>';
  apiGet("/api/overview").then(renderRating)
    .catch(e => { app.innerHTML = '<div class="err">Не удалось загрузить рейтинг.<br><span class="sub">' + esc(String(e)) + '</span></div>'; });
}

function standingsTable(rows) {
  if (!rows.length) return '<div class="empty">Ещё нет завершённых событий.</div>';
  return '<table>' + rows.map(p => {
    const m = crown(p.rank);
    const neg = p.score < 0 ? " neg" : "";
    return '<tr>' +
      '<td class="rk">' + (m ? '<span class="m">' + m + '</span>' : p.rank) + '</td>' +
      '<td class="nm">' + esc(p.display) +
        '<div class="sub">был ' + p.went + ' · ожидал ' + p.waited + ' · не был ' + p.missed + ' · слился ' + p.bailed + '</div></td>' +
      '<td class="sc' + neg + '">' + p.score + '</td>' +
    '</tr>';
  }).join("") + '</table>';
}

function renderRating(data) {
  const seasons = data.seasons || [];
  const active = seasons.filter(s => s.status === "active");
  const closed = seasons.filter(s => s.status === "closed").reverse();

  let html = data.title ? `<div class="muted" style="margin-bottom:8px">${esc(data.title)}</div>` : "";
  html += '<div class="row" style="margin-bottom:12px"><button data-action="post-rating">📣 Запостить мой рейтинг в чат</button></div>';

  if (!seasons.length) html += '<div class="empty">Пока нет ни одного сезона.</div>';

  for (const s of active) {
    html += '<details class="card" open>' +
      '<summary class="season-head"><span class="badge">Активен</span> ' + esc(s.name) + '<span class="chev">▸</span></summary>' +
      standingsTable(s.standings) +
      (data.is_admin ? '<div class="row" style="margin-top:12px"><button data-action="end-season">Завершить сезон</button></div>' : '') +
      '</details>';
  }

  if (closed.length) {
    html += '<div class="muted" style="margin:16px 0 8px">Прошлые сезоны</div>';
    for (const s of closed) {
      html += '<details class="card">' +
        '<summary class="season-head"><span class="badge closed">Завершён</span> ' + esc(s.name) +
        '<span class="chev">▸</span></summary>' +
        standingsTable(s.standings) + '</details>';
    }
  }

  app.innerHTML = html;
  const endBtn = app.querySelector('[data-action="end-season"]');
  if (endBtn) endBtn.onclick = onEndSeason;
  app.querySelector('[data-action="post-rating"]').onclick = onPostRating;
}

// ------------------------------------------------------------------ Донат

function loadDonate() {
  app.innerHTML = donateCardHtml();
  wireDonateButtons();
}

function onEndSeason() {
  confirmDialog("Завершить активный сезон? Итоги заморозятся, рейтинг обнулится, начнётся новый сезон.")
    .then(ok => { if (ok) withBusy(() => apiPost(`/api/chats/${CHAT_ID}/seasons/close`, {}), loadRating); });
}

function onPostRating() {
  if (busy) return;
  busy = true;
  app.querySelectorAll("button").forEach(b => b.disabled = true);
  apiPost(`/api/chats/${CHAT_ID}/rating/post`, {})
    .then(r => { if (!r.posted) (tg.showAlert || alert)("Ты ещё не участвовал ни в одном завершённом событии — рейтинга пока нет."); })
    .catch(e => (tg.showAlert || alert)(String(e)))
    .finally(() => { busy = false; loadRating(); });
}
</script>
</body>
</html>
